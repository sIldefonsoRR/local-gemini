services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11500:11434"
    volumes:
      - ollama_data:/root/.ollama

  gemini-bridge:
    build: .
    container_name: gemini-bridge
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      - ollama

volumes:
  ollama_data:
